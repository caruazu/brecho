{% load static %}
<!doctype html>
<html lang="pt-br" data-bs-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Brechó{% endblock %}</title>

    <!-- Bootswatch BRITE (compila Bootstrap 5.3.8) -->
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.8/dist/brite/bootstrap.min.css">

    <link rel="stylesheet" href="{% static 'catalogo/theme.css' %}">

    <!-- Fontes do projeto -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Comic+Relief:wght@400;700&display=swap" rel="stylesheet">

    <!-- Seu JS (coloque o arquivo em catalogo/static/catalogo/app.js) -->
    <script src="{% static 'catalogo/app.js' %}" defer></script>

    <!-- Bootstrap Bundle (JS + Popper) -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-primary border-bottom">
      <div class="container">
        <a class="navbar-brand fs-1" href="/">BRECHÓ</a>
        <div class="ms-auto">
          <a class="btn btn-secondary btn-sm" href="/admin/">Admin</a>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      {% block content %}{% endblock %}
    </main>

    <!-- Toast para feedback (sucesso/erro) -->
    <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 1200">
      <div id="liveToast" class="toast align-items-center text-bg-primary border-0" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
          <div class="toast-body">Ação executada.</div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
      </div>
    </div>

    <!-- força o cookie CSRF a ser gerado -->
    <form class="d-none">{% csrf_token %}</form>
  </body>
</html>
