<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>brecho</title>
</head>
<body>
      {% if itens %}
      <table>
        <thead>
          <tr>
            <th>Item</th>
            <th>Preço</th>
            <th>Estoque</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          {% for item in itens %}
          <tr>
            <td>{{ item.nome }}</td>
            <td>R$ {{ item.preco }}</td>
            <td>{{ item.estoque }}</td>
            <td><span class="badge">Disponível</span></td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    {% else %}
      <p>Nenhum item disponível no momento.</p>
    {% endif %}
</body>
</html>
